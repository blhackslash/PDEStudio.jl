jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: xeon
    container:
      image: forge.blackslash.win/pascal/julia-ci:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']

    steps:
      - uses: actions/checkout@v4

      - name: Install browser test dependencies
        working-directory: test/browser
        run: |
          npm ci --no-audit --no-fund
          # no-op when the image already has the matching browser
          npx playwright-core install chromium

      - uses: https://github.com/julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true

      - uses: https://github.com/julia-actions/julia-runtest@v1
        env:
          PDESTUDIO_BROWSER_TESTS: "true"
        with:
          prefix: xvfb-run
          coverage: false