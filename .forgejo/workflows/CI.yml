name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: xeon-julia
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'

    steps:
      - uses: actions/checkout@v4
      # 1. Install virtual display server for GLMakie headless testing
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install the browser test tools
        working-directory: test/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - uses: https://github.com/julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      
      # 3. Wrap the runtest action in xvfb-run; the browser tests must run (not be skipped) here
      - uses: https://github.com/julia-actions/julia-runtest@v1
        env:
          PDESTUDIO_BROWSER_TESTS: "true"
        with:
          prefix: xvfb-run
          coverage: false