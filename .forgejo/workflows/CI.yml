name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Julia
        uses: https://github.com/julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      # 1. Install virtual display server for GLMakie headless testing
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: https://github.com/julia-actions/julia-buildpkg@v1
        with:
          ignore-no-cache: true
      
      # 2. Wrap the runtest action in xvfb-run
      - uses: https://github.com/julia-actions/julia-runtest@v1
        with:
          prefix: xvfb-run
          coverage: false